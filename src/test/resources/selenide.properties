# Selenide reads this file itself; system properties override it,
# e.g. ./mvnw test -Dselenide.headless=false -Dselenide.browser=firefox
selenide.baseUrl=https://www.saucedemo.com
selenide.browser=chrome
selenide.headless=true
selenide.browserSize=1920x1080
# Max time (ms) a condition such as shouldBe(visible) keeps retrying before failing
selenide.timeout=8000
# SauceDemo marks elements with data-test="..." -> used by Selectors.byTestId(...)
selenide.test-id.attribute=data-test
selenide.reportsFolder=target/selenide-reports
selenide.downloadsFolder=target/downloads
selenide.savePageSource=false
