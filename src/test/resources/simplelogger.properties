org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.com.codeborne.selenide=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
# Selenide tries to read browser console logs over WebDriver BiDi, which is not enabled
# for this suite; the resulting warning on every browser start is noise.
org.slf4j.simpleLogger.log.com.codeborne.selenide.impl.BiDiUti=error
